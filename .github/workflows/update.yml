name: Update VIP II daily analytics

on:
  workflow_dispatch:
    inputs:
      force:
        description: Recompute even if the latest completed session is published
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/update.yml"]
  schedule:
    # Hourly checks, matching the TXO and SPX workflows.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: vip-ii-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      TZ: UTC
      FORCE_UPDATE: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate algorithms and publication safeguards
        run: python -m pytest -q
      - name: Fetch completed daily sessions and calculate all six estimators
        run: |
          if [ "$FORCE_UPDATE" = "true" ]; then
            python -m vip2.update --force
          else
            python -m vip2.update
          fi
      - name: Publish changed chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "data: update VIP II daily analytics"
            git push
          fi
